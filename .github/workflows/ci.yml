name: CI Checks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-unit-tests:
    name: Backend Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "backend/pyproject.toml"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "backend/[test]"
          pip install pytest pytest-asyncio respx httpx

      - name: Run Unit Tests
        env:
          ENCRYPTION_KEY: "MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE="
          WORKSPACE_ROOT: "tests/.workspaces"
        run: |
          cd backend
          pytest tests/ -v

  backend-postgres-integration:
    name: PostgreSQL Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: primacy_test
          POSTGRES_USER: primacy
          POSTGRES_PASSWORD: primacy_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "backend/pyproject.toml"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "backend/[test]"
          pip install pytest pytest-asyncio psycopg[binary] alembic respx httpx

      - name: Run Migrations
        env:
          DATABASE_URL: postgresql://primacy:primacy_test_password@localhost:5432/primacy_test
          ENCRYPTION_KEY: "MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE="
        run: |
          cd backend
          alembic upgrade heads

      - name: Run Integration Tests
        env:
          DATABASE_URL: postgresql://primacy:primacy_test_password@localhost:5432/primacy_test
          ENCRYPTION_KEY: "MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE="
          WORKSPACE_ROOT: "tests/.workspaces"
        run: |
          cd backend
          pytest tests/ -v

  golden-module-odoo19:
    name: Odoo 19 Golden Module Installation Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Test Golden Module Installation in Official Odoo 19 Docker Container
        run: |
          docker run --rm \
            --network host \
            -v "${{ github.workspace }}/backend/tests/fixtures/test_addon:/mnt/extra-addons:ro" \
            -e HOST=localhost \
            -e PORT=5432 \
            -e USER=odoo \
            -e PASSWORD=odoo_test_password \
            odoo:19.0 \
            odoo \
            -d golden_test_db \
            -i primacy_test_fixture \
            --test-enable \
            --stop-after-init \
            --no-http

  frontend-checks:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install Dependencies
        run: npm ci
        working-directory: ./frontend

      - name: Run ESLint
        run: npm run lint
        working-directory: ./frontend

      - name: Build Next.js App
        run: npm run build
        working-directory: ./frontend
