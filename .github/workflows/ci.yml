name: CI Checks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: "17 2 * * *"

jobs:
  security-scans:
    name: Dependency and Static Security Scans
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "backend/pyproject.toml"

      - name: Install Backend Dependencies and Scanners
        run: |
          python -m pip install --upgrade pip
          pip install -e "backend/[test]" pip-audit bandit

      - name: Audit Python Dependencies
        run: pip-audit --skip-editable

      - name: Run Bandit
        run: bandit -r backend -ll -x backend/tests,backend/.venv

      - name: Install Frontend Dependencies
        run: npm ci
        working-directory: ./frontend

      - name: Audit Node Dependencies
        run: npm audit --audit-level=high
        working-directory: ./frontend

  backend-unit-tests:
    name: Backend Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "backend/pyproject.toml"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "backend/[test]"
          pip install pytest pytest-asyncio respx httpx

      - name: Run Unit Tests
        env:
          ENCRYPTION_KEY: "MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE="
          WORKSPACE_ROOT: "tests/.workspaces"
        run: |
          cd backend
          pytest tests/ -v --cov=. --cov-report=term-missing --cov-report=xml:coverage.xml --cov-fail-under=60

      - name: Upload Backend Coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-unit-coverage
          path: backend/coverage.xml

  backend-postgres-integration:
    name: PostgreSQL Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: primacy_test
          POSTGRES_USER: primacy
          POSTGRES_PASSWORD: primacy_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "backend/pyproject.toml"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "backend/[test]"
          pip install pytest pytest-asyncio psycopg[binary] alembic respx httpx

      - name: Run Migrations
        env:
          DATABASE_URL: postgresql://primacy:primacy_test_password@localhost:5432/primacy_test
          ENCRYPTION_KEY: "MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE="
        run: |
          cd backend
          alembic upgrade heads

      - name: Run Integration Tests
        env:
          DATABASE_URL: postgresql://primacy:primacy_test_password@localhost:5432/primacy_test
          ENCRYPTION_KEY: "MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE="
          WORKSPACE_ROOT: "tests/.workspaces"
        run: |
          cd backend
          pytest tests/ -v --cov=. --cov-report=term-missing --cov-report=xml:coverage.xml --cov-fail-under=60

      - name: Upload Backend Integration Coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-integration-coverage
          path: backend/coverage.xml

  golden-module-odoo19:
    name: Odoo 19 Golden Module Installation Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Test Golden Module Installation in Official Odoo 19 Docker Container
        run: |
          docker run --rm \
            --network host \
            -v "${{ github.workspace }}/backend/tests/fixtures/test_addon:/mnt/extra-addons:ro" \
            -e HOST=localhost \
            -e PORT=5432 \
            -e USER=odoo \
            -e PASSWORD=odoo_test_password \
            odoo:19.0 \
            odoo \
            -d golden_test_db \
            -i primacy_test_fixture \
            --test-enable \
            --stop-after-init \
            --no-http

  frontend-checks:
    name: Frontend Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install Dependencies
        run: npm ci
        working-directory: ./frontend

      - name: Run ESLint
        run: npm run lint
        working-directory: ./frontend

      - name: Run Frontend Unit Tests
        run: npm test
        working-directory: ./frontend

      - name: Run TypeScript Check
        run: npx tsc --noEmit
        working-directory: ./frontend

      - name: Build Next.js App
        run: npm run build
        working-directory: ./frontend

  browser-e2e:
    name: Browser E2E Tests
    runs-on: ubuntu-latest
    needs: frontend-checks

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install Dependencies
        run: npm ci
        working-directory: ./frontend

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium firefox webkit
        working-directory: ./frontend

      - name: Run Browser Tests
        run: npm run test:e2e
        working-directory: ./frontend

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          if-no-files-found: ignore

      - name: Upload Playwright Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: frontend/test-results/
          if-no-files-found: ignore

  container-smoke:
    name: Container Startup and Recovery Smoke Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Start disposable stack
        run: docker compose -f docker-compose.test.yml up -d --build --wait

      - name: Verify API and worker health
        run: |
          python - <<'PY'
          import json
          import urllib.request

          payload = json.load(urllib.request.urlopen("http://127.0.0.1:8001/health"))
          assert payload["api"] == "healthy", payload
          assert payload["database"] == "healthy", payload
          assert payload["worker"] == "healthy", payload
          PY

      - name: Verify worker crash recovery
        run: |
          docker compose -f docker-compose.test.yml exec -T worker sh -c 'kill -9 1' || true
          docker compose -f docker-compose.test.yml up -d --wait worker
          python - <<'PY'
          import json
          import time
          import urllib.request

          deadline = time.time() + 45
          while time.time() < deadline:
              try:
                  payload = json.load(urllib.request.urlopen("http://127.0.0.1:8001/health", timeout=5))
                  if payload.get("worker") == "healthy":
                      print(json.dumps(payload, indent=2))
                      break
              except Exception:
                  pass
              time.sleep(2)
          else:
              raise AssertionError(payload)
          PY

      - name: Tear down disposable stack
        if: always()
        run: docker compose -f docker-compose.test.yml down -v

  browser-real-backend:
    name: Real Backend Browser Smoke Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Start disposable backend stack
        run: docker compose -f docker-compose.test.yml up -d --build --wait

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Run real backend browser smoke test
        run: npm run test:e2e -- --project=real-backend
        working-directory: frontend
        env:
          REAL_BACKEND_E2E: '1'
          NEXT_PUBLIC_API_URL: http://localhost:8001

      - name: Tear down disposable backend stack
        if: always()
        run: docker compose -f docker-compose.test.yml down -v
