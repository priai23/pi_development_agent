services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: erp_agent
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d erp_agent"]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - primacy_test_postgres:/var/lib/postgresql/data

  migrate:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/erp_agent
      ENCRYPTION_KEY: MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=
    command: ["alembic", "upgrade", "heads"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/erp_agent
      ENCRYPTION_KEY: MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=
      FRONTEND_ORIGIN: http://localhost:3000
      TRUSTED_HOSTS: localhost,127.0.0.1,api
      ERP_ALLOWED_HOSTS: localhost,127.0.0.1
      WORKSPACE_ROOT: /data/workspaces
      PUBLIC_BASE_URL: http://localhost:8001
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8001"]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "${API_PORT:-8001}:8001"
    restart: on-failure:5
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 12

  worker:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/erp_agent
      ENCRYPTION_KEY: MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=
      WORKSPACE_ROOT: /data/workspaces
    command: ["python", "worker.py"]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: on-failure:5

volumes:
  primacy_test_postgres:
