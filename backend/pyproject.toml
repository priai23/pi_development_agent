[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pi_development_agent"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.19,<2",
  "argon2-cffi>=25,<26",
  "cryptography>=50,<51",
  "defusedxml>=0.7,<1",
  "email-validator>=2.3,<3",
  "fastapi>=0.141,<1",
  "graphifyy>=0.9,<1",
  "httpx>=0.28,<1",
  "langchain-openai>=1.4,<2",
  "langgraph>=1.2,<2",
  "langgraph-checkpoint-postgres>=3.1,<4",
  "psycopg[binary,pool]>=3.3,<4",
  "pydantic-settings>=2.15,<3",
  "pypdf>=6.16.1,<7",
  "python-magic>=0.4,<1",
  "python-multipart>=0.0.9,<1",
  "pyyaml>=6.0,<7",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.52,<1",
]

[project.optional-dependencies]
ocr = ["pytesseract>=0.3,<1"]
test = ["pytest>=9,<10", "pytest-asyncio>=0.23", "pytest-cov>=7,<8", "respx>=0.22,<1"]

[tool.setuptools]
py-modules = ["agent", "attachment", "auth", "config", "database", "deployment", "erp_adapter", "main", "manage", "model_conformance", "models", "permissions", "pri_erp_adapter", "schemas", "security", "source_indexer", "specification", "telemetry", "tool_registry", "validation", "worker", "workspace"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
