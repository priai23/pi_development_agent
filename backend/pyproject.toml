[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pi-erp-implementation-agent"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.19,<2",
  "argon2-cffi>=25,<26",
  "cryptography>=50,<51",
  "email-validator>=2.3,<3",
  "fastapi>=0.141,<1",
  "graphifyy>=0.9,<1",
  "httpx>=0.28,<1",
  "langchain-openai>=1.4,<2",
  "langgraph>=1.2,<2",
  "langgraph-checkpoint-postgres>=3.1,<4",
  "psycopg[binary,pool]>=3.3,<4",
  "pydantic-settings>=2.15,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.52,<1",
]

[project.optional-dependencies]
test = ["pytest>=9,<10"]

[tool.setuptools]
py-modules = ["agent", "auth", "config", "database", "deployment", "main", "manage", "models", "schemas", "security", "validation", "worker", "workspace"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
